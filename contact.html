<div class="container">

    <div class="contact-card">

        <div class="title">
            <h2>📩 संपर्क करें</h2>

            <p>
                अपनी प्रतिक्रिया, सुझाव या संदेश मुझे भेजें।
            </p>
        </div>

        <form>

            <label for="name">आपका नाम</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="अपना नाम लिखें"
                required
            >


            <label for="email">ई-मेल</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="अपना ई-मेल लिखें"
                required
            >


            <label for="message">आपका संदेश</label>

            <textarea
                id="message"
                name="message"
                placeholder="अपना संदेश यहाँ लिखें..."
                required
            ></textarea>


            <button type="submit">
                संदेश भेजें
            </button>

        </form>

        <p class="note">
            जल्द ही इस form को email receiving system से जोड़ा जाएगा।
        </p>

    </div>

</div>

<footer>
