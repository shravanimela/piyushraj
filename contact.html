<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>संपर्क करें | Piyush Raj</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, "Noto Serif Devanagari", serif;
            background: #f8f5ef;
            color: #2d2d2d;
            line-height: 1.7;
        }

        header {
            background: #2f241f;
            color: white;
            text-align: center;
            padding: 45px 20px;
        }

        header h1 {
            font-size: 38px;
        }

        header p {
            color: #e7d7bd;
        }

        nav {
            background: white;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        nav a {
            text-decoration: none;
            color: #2f241f;
            font-weight: bold;
            margin: 0 12px;
        }

        nav a:hover {
            color: #a45c2c;
        }

        .container {
            max-width: 700px;
            margin: 45px auto;
            padding: 20px;
        }

        .contact-card {
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h2 {
            color: #6f3c26;
            font-size: 32px;
        }

        .title p {
            color: #777;
            margin-top: 5px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 16px;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #8b4d2f;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 25px;
            background: #8b4d2f;
            color: white;
            font-size: 17px;
            font-family: inherit;
            cursor: pointer;
        }

        button:hover {
            background: #5f321f;
        }

        .note {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 14px;
        }

        footer {
            background: #2f241f;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 50px;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 30px;
            }

            nav a {
                display: inline-block;
                margin: 5px 7px;
            }

            .contact-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Piyush Raj</h1>
    <p>कवि एवं लेखक</p>
</header>

<nav>
    <a href="index.html">होम</a>
    <a href="poems.html">कविताएँ</a>
    <a href="stories.html">कहानियाँ</a>
    <a href="about.html">मेरे बारे में</a>
    <a href="contact.html">संपर्क</a>
</nav>

<div class="container">

    <div class="contact-card">

        <div class="title">
            <h2>📩 संपर्क करें</h2>

            <p>
                अपनी प्रतिक्रिया, सुझाव या संदेश मुझे भेजें।
            </p>
        </div>

        <form>

            <label for="name">आपका नाम</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="अपना नाम लिखें"
                required
            >


            <label for="email">ई-मेल</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="अपना ई-मेल लिखें"
                required
            >


            <label for="message">आपका संदेश</label>

            <textarea
                id="message"
                name="message"
                placeholder="अपना संदेश यहाँ लिखें..."
                required
            ></textarea>


            <button type="submit">
                संदेश भेजें
            </button>

        </form>

        <p class="note">
            जल्द ही इस form को email receiving system से जोड़ा जाएगा।
        </p>

    </div>

</div>

<footer>
    <p>© 2026 Piyush Raj | कवि एवं लेखक</p>
    <p>मेरे शब्द, मेरे एहसास</p>
</footer>

</body>
</html>
